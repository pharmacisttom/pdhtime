<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pdhtime - ลงเวลาปฏิบัติงาน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #camera-preview { width: 100%; max-width: 400px; border-radius: 10px; background: #000; }
        #canvas { display: none; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-4 text-center">
        <h2 class="text-primary mb-4">pdhtime</h2>
        
        <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
            <div class="mb-3">
                <input type="text" id="empId" class="form-control mb-2" placeholder="รหัสเจ้าหน้าที่ (เช่น จากระบบ HIS)">
                <input type="text" id="empName" class="form-control" placeholder="ชื่อ-นามสกุล">
            </div>

            <!-- กล้อง -->
            <div class="mb-3">
                <video id="camera-preview" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
            </div>
            <p id="status-text" class="text-muted">กำลังตรวจสอบพิกัด GPS...</p>

            <!-- ปุ่มกด -->
            <div class="d-grid gap-2">
                <button class="btn btn-success btn-lg" id="btn-checkin" disabled>ลงเวลาเข้างาน (Check-In)</button>
                <button class="btn btn-danger btn-lg" id="btn-checkout" disabled>ลงเวลาออกงาน (Check-Out)</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
