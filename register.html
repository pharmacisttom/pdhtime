<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนเจ้าหน้าที่ - pdhtime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4 mb-5">
        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0">ลงทะเบียนเข้าใช้งาน pdhtime</h4>
            </div>
            <div class="card-body p-4">
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">เลขประจำตัวประชาชน 13 หลัก</label>
                        <input type="text" id="regIdCard" class="form-control" maxlength="13" placeholder="ระบุเลข 13 หลัก (พิมพ์ติดกัน)" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">ชื่อ-นามสกุล</label>
                        <input type="text" id="regName" class="form-control" placeholder="เช่น นายแพทย์สมชาย ใจดี" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">ตำแหน่ง</label>
                        <input type="text" id="regPosition" class="form-control" placeholder="เช่น พยาบาลวิชาชีพ" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">แผนก</label>
                        <select id="regDepartment" class="form-select" required>
                            <option value="">-- เลือกแผนก --</option>
                            <option value="OPD">ผู้ป่วยนอก (OPD)</option>
                            <option value="IPD">ผู้ป่วยใน (IPD)</option>
                            <option value="ER">อุบัติเหตุ-ฉุกเฉิน (ER)</option>
                            <option value="Admin">สายสนับสนุน / บริหาร</option>
                        </select>
                    </div>
                    <hr>
                    <h5 class="text-success mb-3">ตั้งค่าการเข้าสู่ระบบ</h5>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" id="regUsername" class="form-control" placeholder="ตั้งชื่อผู้ใช้งาน (ภาษาอังกฤษ/ตัวเลข)" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="ตั้งรหัสผ่าน" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="button" id="btn-register" class="btn btn-success btn-lg">บันทึกข้อมูลลงทะเบียน</button>
                        <a href="login.html" class="btn btn-outline-secondary">กลับไปหน้าเข้าสู่ระบบ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyxwG1-WHwGFNWC3sWia7GYSCgGC43hxDY_fFkWhNZtSYEdFH1URBVGYPZTQOr_1JNzrg/exec'; // ใช้ URL เดียวกับ app.js

        document.getElementById('btn-register').addEventListener('click', function() {
            const idCard = document.getElementById('regIdCard').value.trim();
            const name = document.getElementById('regName').value.trim();
            const position = document.getElementById('regPosition').value.trim();
            const department = document.getElementById('regDepartment').value;
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (idCard.length !== 13 || isNaN(idCard)) { alert("กรุณาระบุเลข 13 หลักให้ถูกต้อง"); return; }
            if (!name || !position || !department || !username || !password) { alert("กรุณากรอกข้อมูลให้ครบทุกช่อง"); return; }

            const btn = document.getElementById('btn-register');
            btn.disabled = true; btn.innerHTML = 'กำลังบันทึก...';

            const payload = {
                requestType: 'register',
                idCard: idCard, name: name, position: position,
                department: department, username: username, password: password
            };

            fetch(WEB_APP_URL, { 
                method: 'POST', 
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
                return res.json();
            })
            .then(data => {
                alert(data.message);
                if(data.status === 'success') window.location.href = 'login.html';
                btn.disabled = false; btn.innerHTML = 'บันทึกข้อมูลลงทะเบียน';
            }).catch(err => {
                console.error('Register Error:', err);
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + err.message);
                btn.disabled = false; btn.innerHTML = 'บันทึกข้อมูลลงทะเบียน';
            });
        });
    </script>
</body>
</html>
