<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงเวลาปฏิบัติงาน - pdhtime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* CSS แก้ปัญหากล้องและทำให้ภาพกลับด้าน (Mirror) */
        #camera-preview { 
            width: 100%; 
            max-width: 400px; 
            border-radius: 10px; 
            background: #000; 
            transform: scaleX(-1); /* กลับซ้ายขวา */
            object-fit: cover;
        }
        #canvas { display: none; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-3 mb-5 text-center">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="text-primary mb-0">pdhtime</h3>
            <button class="btn btn-sm btn-outline-danger" onclick="logout()">ออกจากระบบ</button>
        </div>
        
        <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
            <div class="mb-3 text-start bg-light p-2 rounded border">
                <small class="text-muted d-block">รหัสเจ้าหน้าที่:</small>
                <strong id="displayEmpId" class="fs-5">Loading...</strong>
                <small class="text-muted d-block mt-2">ชื่อ-สกุล:</small>
                <strong id="displayEmpName" class="fs-5 text-primary">Loading...</strong>
            </div>

            <div class="mb-3">
                <video id="camera-preview" autoplay playsinline muted></video>
                <canvas id="canvas"></canvas>
            </div>
            
            <div id="status-container" class="alert alert-warning py-2 mb-3">
                <span id="status-text" class="fw-bold">กำลังประมวลผล GPS และกล้อง...</span>
            </div>

            <div class="d-grid gap-2">
                <button class="btn btn-success btn-lg py-3 fw-bold" id="btn-checkin" disabled>ลงเวลาเข้างาน (Check-In)</button>
                <button class="btn btn-danger btn-lg py-3 fw-bold" id="btn-checkout" disabled>ลงเวลาออกงาน (Check-Out)</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
