<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - pdhtime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="card shadow-sm mx-auto" style="max-width: 400px;">
            <div class="card-body p-4 text-center">
                <h3 class="text-primary mb-4">pdhtime Login</h3>
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold">Username</label>
                    <input type="text" id="loginUser" class="form-control" placeholder="ชื่อผู้ใช้งาน">
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" id="loginPass" class="form-control" placeholder="รหัสผ่าน">
                </div>
                <div class="d-grid gap-2">
                    <button id="btn-login" class="btn btn-primary btn-lg">เข้าสู่ระบบ</button>
                    <a href="register.html" class="btn btn-outline-secondary">ลงทะเบียนผู้ใช้ใหม่</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ถ้า Login แล้วให้เด้งไปหน้า index เลย
        if (localStorage.getItem('pdhtime_user')) { window.location.href = 'index.html'; }

        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzvDiYvxRvS_TcFHm33EKfeqfKixH0QdsCXscML4JbXH9-k-y9q6ZlWiEyUilyPwyBaew/exec'; // ใช้ URL เดียวกับ app.js

        document.getElementById('btn-login').addEventListener('click', function() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            if(!user || !pass) { alert("กรุณากรอกข้อมูลให้ครบ"); return; }

            const btn = document.getElementById('btn-login');
            btn.disabled = true; btn.innerHTML = 'กำลังตรวจสอบ...';

            fetch(WEB_APP_URL, { 
                method: 'POST', 
                body: JSON.stringify({ requestType: 'login', username: user, password: pass })
            })
            .then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
                return res.json();
            })
            .then(data => {
                if(data.status === 'success') {
                    localStorage.setItem('pdhtime_user', JSON.stringify(data.userData));
                    window.location.href = 'index.html'; 
                } else {
                    alert(data.message);
                    btn.disabled = false; btn.innerHTML = 'เข้าสู่ระบบ';
                }
            }).catch(err => {
                console.error('Login Error:', err);
                alert('การเชื่อมต่อล้มเหลว: ' + err.message);
                btn.disabled = false; btn.innerHTML = 'เข้าสู่ระบบ';
            });
        });
    </script>
</body>
</html>
